name: .NET Core

on:
  push:
    branches: [ "dev", "dev8x", "dev7x", "dev5x" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [ "dev", "dev8x", "dev7x", "dev5x" ]

env:
  TargetNet9: True
  TargetNet8: True

jobs:
  build:
    runs-on: windows-latest
    continue-on-error: true
    name: Wilson GitHub Action Test
    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

    - name: Setup .NET 6.x
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 6.0.x

    - name: Setup .NET 8.0.x
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 9.0.x
      uses: actions/setup-dotnet@v4.0.0
      with:
        dotnet-version: 9.0.100-preview.4.24267.66

    - name: Run the tests
      run: dotnet test Wilson.sln

    # Run baseline package validation
    - name: Pack
      run: dotnet pack Product.proj --no-restore --no-build
